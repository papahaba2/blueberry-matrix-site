name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-frontend-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build static export
        working-directory: frontend
        env:
          # Project page URL: https://<user>.github.io/<repo>/
          # For a custom domain or <user>.github.io, set this to an empty string
          # in the workflow or use a repository variable.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_LIMIT_ORDER_MANAGER_ADDRESS: ${{ vars.V4_LIMIT_ORDER_MANAGER }}
          NEXT_PUBLIC_LIMIT_ORDER_MANAGER_DEPLOY_BLOCK: ${{ vars.V4_LIMIT_ORDER_MANAGER_DEPLOY_BLOCK }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
